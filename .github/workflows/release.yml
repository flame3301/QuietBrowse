name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Build Windows Installer (unsigned)
        run: npm run dist:win
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # -------------------------------------------------------
      # SignPath.io Code Signing
      # Uncomment the step below after your SignPath.io
      # open-source application is approved.
      # Required secrets:
      #   SIGNPATH_API_TOKEN — from your SignPath dashboard
      # Required variables:
      #   SIGNPATH_ORGANIZATION_ID
      #   SIGNPATH_SIGNING_POLICY_SLUG
      #   SIGNPATH_PROJECT_SLUG
      # -------------------------------------------------------
      # - name: Sign with SignPath
      #   uses: signpath/github-action-submit-signing-request@v1
      #   with:
      #     api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
      #     organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
      #     project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
      #     signing-policy-slug: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG }}
      #     artifact-configuration-slug: 'initial'
      #     github-artifact-id: ${{ steps.upload.outputs.artifact-id }}
      #     wait-for-completion: true
      #     output-artifact-directory: dist-electron/signed

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          generate_release_notes: true
          files: |
            dist-electron/*.exe
            dist-electron/*.yml
            dist-electron/*.yaml
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
